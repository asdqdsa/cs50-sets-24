<!DOCTYPE html>

<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <title>Birthdays</title>
</head>

<body>
    <div class="header">
        <h1>Birthdays</h1>
    </div>
    <div class="container">
        <div class="section">

            <h2>Add a Birthday</h2>
            <!-- Create a form for users to submit a name, a month, and a day -->
            <form action="/" method="POST">
                <input autofocus placeholder="Name" type="text" name="name">
                <input autocomplete="off" placeholder="Month" type="number" name="month" min="1" max="12">
                <input autocomplete="off" placeholder="Day" type="number" name="day" min="1" max="31">
                <input type="submit" value="Add Birthday">
            </form>
        </div>

        <div class="section">

            <h2>All Birthdays</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Birthday</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop through the database entries to display them in this table -->
                    {% for cake in cakedays %}
                    <tr>
                        <td>{{ cake.name }}</td>
                        <td>{{ cake.month }}/{{ cake.day }}</td>
                        <td>
                            <form action="/delete/{{ cake.id }}" method="POST">
                                <button type="submit">X</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
